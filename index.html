<!DOCTYPE html>
<html lang="zh">

<head>

<title>中文考试 Chinese Test</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* Remove all spacing /
html, body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#ffffff;
  overflow:auto;

  / official Chinese font style /
  font-family:
    "PingFang SC",
    "Microsoft YaHei",
    "SimSun",
    "Noto Sans SC",
    Arial,
    sans-serif;
}

/ Center image like official site /
.container{
  width:100%;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

/ Full screen responsive image */
img{
  max-width:100vw;
  max-height:100vh;
  width:auto;
  height:auto;
  display:block;
}

</style>

</head>

<body>

<div class="container">
  <img src="photo.JPEG">
</div>

</body>
</html>
